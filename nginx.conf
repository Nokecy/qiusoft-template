server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # 后端反代由各客户自行补在这里（接口前缀、后端服务名各不相同），但有一段是通用的：
    # **实时通道要单独开 WebSocket 升级，而且两个前缀都要**——
    # /dotnetify 是 DotNetify 的通道，/signalr-hubs 是 ABP 侧的 hub（站内通知 badge 走
    # /signalr-hubs/badge）。少配一个的表现不是「连不上」这么直白：该路径会掉进下面的
    # location /，被 try_files 当静态文件处理，而握手第一步 negotiate 是 POST——
    # nginx 对静态文件的 POST 返回 405 Not Allowed。控制台里只显示
    # “Failed to complete negotiation with the server”，从这句话看不出根因在反代少了一段。
    #
    # location ~ ^/(dotnetify|signalr-hubs) {
    #     set $backend_ws "http://<后端服务名>:8080";
    #     proxy_pass         $backend_ws$request_uri;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade    $http_upgrade;
    #     proxy_set_header   Connection "upgrade";
    #     proxy_set_header   Host       $host;
    #     proxy_read_timeout 3600s;   # 长连接不能被 60s 的默认读超时掐断
    # }

    # 运行时配置：装机时挂载覆盖，改完必须立刻生效，绝不允许缓存。
    location = /config/config.js {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        # 这套产物的文件名不带内容指纹（umi 默认 hash: false，产物就是 umi.js、umi.css、
        # p__xxx.chunk.css 这些固定名）。固定名 + 不发 Cache-Control 的组合下，
        # 浏览器只能按启发式自己决定缓存多久——实测发布新版本十几分钟后再访问，
        # umi.js 的 transferSize 是 0，根本没走网络，用户看到的还是上一版页面。
        # 客户现场没人会去按硬刷新，这等于发布不生效。
        #
        # 因此一律 no-cache：不是不缓存，是**每次都必须带 ETag 回来问一次**。
        # 没更新时服务端回 304，只有响应头的开销；更新了就立刻拿到新的。
        add_header Cache-Control "no-cache" always;
    }

    # 图片、字体、媒体文件改名即换内容，可以放心长缓存。
    location ~* \.(png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|mp4)$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    error_page   404  /index.html;
}